# Index worker only: no HTTP, agent, model, auth, workspace or retrieval settings.
# API and worker must target the same storage/Redis/vector/keyword resources.
# For isolated acceptance, use configs/acceptance/worker.yaml instead.
Storage:
  Host: 10.10.2.181
  Port: 5432
  DBName: eino
  Username: postgres
  PasswordEnv: "EINO_STORAGE_PASSWORD"
  MaxOpenConn: 100
  SSLMode: disable

Observability:
  LogLevel: "info"
  ServiceName: "eino-harness-worker"
  Environment: "development"
  OTLPEndpoint: "10.10.2.90:4317"
  OTLPInsecure: true
  TraceSampleRatio: 1.0
  LogFilePath: "logs/eino/worker.json"
  LogMaxSizeMB: 100
  LogMaxBackups: 5
  LogMaxAgeDays: 14

# Legacy content directory is read only; new bodies come from PostgreSQL.
Knowledge:
  Root: "./tests/knowledge"
  MaxDocumentBytes: 5242880
  ChunkSizeCharacters: 1200
  ChunkOverlapCharacters: 200
  MaxChunksPerDocument: 2000

Embedding:
  BaseURL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  APIKeyEnv: "EINO_EMBEDDING_API_KEY"
  Model: "qwen3.7-text-embedding"
  Dimensions: 1024
  # 单次 embedding 请求最多带几段文本 —— 服务方的硬上限，不是调优项。
  # 超了会回 400「batch size is invalid, it should not be larger than 10」，
  # 而那一刻向量还没写、检索索引也还没写，整篇文档会什么都索引不上。
  # DashScope：text-embedding-v3/v4 上限 10，qwen3.7-text-embedding 上限 20。
  BatchSize: 10

Milvus:
  Address: "10.10.2.90:19530"
  Collection: "eino_document_chunks_v1"
  MetricType: "COSINE"

ES:
  Address:
    - https://10.4.99.100:30920
  Index: "eino_document_chunks_v1"
  Analyzer: "ik_max_word"
  Username: "elastic"
  PasswordEnv: "EINO_ES_PASSWORD"
  CaCertPath: "configs/http_ca.crt"
  BulkSize: 500
  # 检索面声明：字段、类型、权重、从元数据的哪个路径取值。
  # 路径相对进程的工作目录（在仓库根启动时就是仓库根）。
  MappingFile: "configs/es/chunk_mapping.yaml"

Indexer:
  # 一轮从 document_chunks 里取多少 pending 分块做 embedding + 写库。
  # 只影响批处理粒度，不是单次 embedding 请求的大小 —— 后者由
  # Embedding.BatchSize 决定，Embedder 会把请求切到那个上限以内。
  BatchSize: 32

Asynq:
  Enabled: true
  Redis:
    Addr: "10.10.2.90:6379"
    Username: ""
    PasswordEnv: ""
    DB: 0
  Queues:
    - Name: "index"
      Weight: 1
  Concurrency: 10
  MaxRetries: 5
  RetryDelaySeconds: 30
  MaxRetryDelaySeconds: 900
  ShutdownTimeoutSeconds: 300

Maintenance:
  # 维护入口复用 worker 配置；周期任务首次启动会先执行一次清理。
  CleanupIntervalSeconds: 300
  TurnRetentionHours: 168
  CleanupBatchSize: 100
