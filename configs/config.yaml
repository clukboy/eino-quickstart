server:
  host: "0.0.0.0"
  port: 8080

agent:
  name: "eino-harness"
  instruction: |
    You are an autonomous software engineering assistant.
    Use tools when you need to inspect or modify the workspace.
    Never claim that a command succeeded unless you actually ran it.
    Prefer filesystem tools for inspecting files and shell for build/test commands.
    Keep destructive operations to the minimum necessary.
  max_iterations: 20

model:
  provider: "qwen"
  baseURL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  apiKey: ""
  model: "qwen3.8-max"
  temperature: 0.2

workspace:
  root: "./workspace"
  shellTimeoutSeconds: 30
  maxOutputBytes: 65536

skills:
  root: "./skills"
  maxReadBytes: 32768
security:
  allowedTools:
    - read_file
    - list_dir
    - write_file
    - search_knowledge
  requireApprovalForShell: true
  requireApprovalForWrite: false
  maxApprovalArgumentBytes: 65536
  approvalTTLSeconds: 1800
  sensitiveArgumentKeys:
    - apiKey
    - api_key
    - authorization
    - cookie
    - password
    - secret
    - token
    - access_token
    - refresh_token
    - private_key
context:
  maxHistoryMessages: 40
  maxToolOutputBytes: 131072

storage:
  host: 10.10.2.181
  port: 5432
  dbName: eino
  username: postgres
  passwordEnv: "EINO_STORAGE_PASSWORD"
  maxOpenConn: 100
  sslMode: disable

auth:
  enabled: true
  apiKeys:
    - subject: "developer-1"
      role: "agent"
      keyEnv: "EINO_API_KEY_DEVELOPER"
    - subject: "reviewer-1"
      role: "approver"
      keyEnv: "EINO_API_KEY_APPROVER"
    - subject: "platform-admin"
      role: "admin"
      keyEnv: "EINO_API_KEY_ADMIN"

runtime:
  readTimeoutSeconds: 15
  writeTimeoutSeconds: 120
  idleTimeoutSeconds: 60
  maxRequestBodyBytes: 5242880

observability:
  logLevel: "info"
  metricsEnabled: true

  # HTTP 进程（cmd/restapi）在 trace 里的服务名。
  serviceName: "eino-harness-server"
  # worker 进程（cmd/worker）在 trace 里的服务名。必须与上面区分开：一篇文档的
  # 索引是「HTTP 投递 -> Redis -> worker 消费」的跨服务调用，同名会显示成服务
  # 自己调自己，异步那一段看不见。留空则回落成 serviceName + "-worker"。
  workerServiceName: "eino-harness-worker"
  environment: "development"

  # OTLP 端点。留空也照样安装 provider（只是不导出）—— provider 在不在决定了
  # trace id 有没有值，跨进程链路因此不会因为少配一个端点就静默断掉。
  otlpEndpoint: "10.10.2.90:4317"
  otlpInsecure: true
  # 采样率。<= 0 会被当作 1.0（全采），避免漏填一个字段就变成一条都不采。
  traceSampleRatio: 1.0

  logFilePath: "logs/eino/server.json"
  logMaxSizeMB: 100
  logMaxBackups: 5
  logMaxAgeDays: 14

execution:
  mode: "docker"
  dockerBinary: "docker"
  image: "eino-harness-executor:0.1.0"
  user: "10001:10001"
  memoryLimit: "512m"
  cpuLimit: "1.0"
  pidsLimit: 128
  tmpFSSize: "64m"
  allowNetwork: false
  allowLocalRunner: false

knowledge:
  root: "./tests/knowledge"
  maxDocumentBytes: 5242880
  chunkSizeCharacters: 1200
  chunkOverlapCharacters: 200
  maxChunksPerDocument: 2000
  defaultTopK: 5
  maxTopK: 10
  maxQueryCharacters: 2000
  maxResultBytes: 32768

embedding:
  baseURL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  apiKeyEnv: "EINO_EMBEDDING_API_KEY"
  model: "qwen3.7-text-embedding"
  dimensions: 1024
  batchSize: 32

milvus:
  address: "10.10.2.90:19530"
  collection: "eino_document_chunks_v1"
  metricType: "COSINE"
  topKCandidate: 30
  searchTimeoutMS: 3000

maintenance:
  cleanupIntervalSeconds: 300
  approvalRetentionHours: 168
  checkpointRetentionHours: 24
  turnRetentionHours: 720
  cleanupBatchSize: 100

retrieval:
  # 产品检索：
  # Exact > Keyword > Vector
  exactWeight: 3.0
  keywordWeight: 1.5
  vectorWeight: 1.0

  rrfSmoothing: 60

  exactCandidateLimit: 20
  keywordCandidateLimit: 30
  vectorCandidateLimit: 30

  enableRerank: false
  maxRerankCandidates: 20

# 索引链路的切块/embedding 参数。这里没有 enabled 开关：是不是索引进程由「跑的是
# cmd/worker 还是 cmd/restapi」决定，worker 侧的启停统一看下面的 asynq.enabled。
indexer:
  # 一次送多少段文本去 embedding（单请求条数有上限，分批是硬需求）。
  batchSize: 32

# 文档索引的异步队列。HTTP 进程只投递，cmd/worker 只消费，两边连同一个 Redis。
# enabled=false 时索引任务无处投递，写文档的请求会直接失败 —— 只在「明知索引
# 链路整体停摆也要让 HTTP 起来」的排障场景下才关它。
asynq:
  enabled: true
  redis:
    addr: "10.10.2.90:6379"
    username: ""
    passwordEnv: ""
    db: 0
  # 队列名到权重的映射，权重越高被拉取得越频繁。索引任务走 index 队列，
  # 与将来的短任务分开，避免长任务占满并发槽。
  queues:
    - name: "index"
      weight: 1
  # 同时处理的任务数。索引任务大部分时间在等 embedding 的网络往返，
  # 所以这个值可以远大于 CPU 核数。
  concurrency: 10
  # 单个任务的重试次数上限，含首次共执行 maxRetries+1 次。
  # 每次重跑只挑 pending 的分块，重试天然续跑。耗尽后剩余分块与文档标 failed。
  maxRetries: 5
  retryDelaySeconds: 30
  maxRetryDelaySeconds: 900
  # 优雅关闭上限：已开始的任务最多再跑这么久，超时的退回队列由下个实例重新领取。
  shutdownTimeoutSeconds: 300
