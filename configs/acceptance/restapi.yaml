Name: eino-quickstart-restapi
Host: 127.0.0.1
Port: 8090
MaxBytes: 52428800
Timeout: 15000000
Log:
  Mode: console
  Level: info
Telemetry:
  Name: eino-quickstart-restapi
  # Sampler: 1.0          # 默认全采样
  Endpoint: 127.0.0.1:4317 # 填上才开始真正导出 span（Batcher 默认 otlpgrpc）

Shutdown:
  WrapUpTime: 1s
  WaitTime: 30s

# go-zero 原生 Prometheus agent：**独立端口**暴露，与上面的 8090 分开。
# 由 Start() 里的 ServiceConf.SetUp() 启动 —— go-zero 的 rest 自己不会调 SetUp，
# 必须由进程显式调用，否则这个监听不会起来。
#
# 指标名是 go-zero 的 http_server_requests_duration_ms /
# http_server_requests_code_total（labels: path/method/code），
# 与旧的 eino_harness_* 私有指标不是同一套，抓取规则要跟着改。
#
# 指标独立监听，不占用业务 HTTP 端口；默认只绑定本机，交给本机 Prometheus
# 或反向代理采集。若部署需要跨主机抓取，应在部署层显式改 Host 并限制网络访问。
Prometheus:
  Host: 127.0.0.1
  Port: 9091
  Path: /metrics
