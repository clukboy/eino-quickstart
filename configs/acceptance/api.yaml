# Isolated acceptance template; provision local dependencies before normal startup.
# API business settings only. HTTP listening is configured in restapi.yaml.
# Shared service addresses below preserve the old development examples.
# For isolated acceptance, use configs/acceptance/api.yaml instead.
# Business server settings retained for executor checks; HTTP Host/Port are in restapi.yaml.
Server:
  Host: "0.0.0.0"
  Port: 8080

Agent:
  Name: "eino-harness"
  Instruction: |
    You are an autonomous software engineering assistant.
    Use tools when you need to inspect or modify the workspace.
    Never claim that a command succeeded unless you actually ran it.
    Prefer filesystem tools for inspecting files and shell for build/test commands.
    Keep destructive operations to the minimum necessary.
  MaxIterations: 20

Model:
  Provider: "qwen"
  BaseURL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  APIKey: ""
  Model: "qwen3.8-max"
  Temperature: 0.2

Workspace:
  Root: "./workspace/acceptance"
  ShellTimeoutSeconds: 30
  MaxOutputBytes: 65536

Skills:
  Root: "./skills"
  MaxReadBytes: 32768
Security:
  AllowedTools:
    - read_file
    - list_dir
    - write_file
    - search_knowledge
  RequireApprovalForShell: true
  RequireApprovalForWrite: false
  MaxApprovalArgumentBytes: 65536
  ApprovalTTLSeconds: 1800
  SensitiveArgumentKeys:
    - apiKey
    - api_key
    - authorization
    - cookie
    - password
    - secret
    - token
    - access_token
    - refresh_token
    - private_key
Context:
  MaxHistoryMessages: 40
  MaxToolOutputBytes: 131072

Storage:
  Host: 127.0.0.1
  Port: 5432
  DBName: eino_acceptance
  Username: postgres
  PasswordEnv: "EINO_STORAGE_PASSWORD"
  MaxOpenConn: 100
  SSLMode: disable

Auth:
  Enabled: true
  APIKeys:
    - Subject: "developer-1"
      Role: "agent"
      KeyEnv: "EINO_API_KEY_DEVELOPER"
    - Subject: "reviewer-1"
      Role: "approver"
      KeyEnv: "EINO_API_KEY_APPROVER"
    - Subject: "platform-admin"
      Role: "admin"
      KeyEnv: "EINO_API_KEY_ADMIN"

  # 匿名身份（用户端）。
  #
  # 上面那三个静态 key 的身份是**写死**的 subject：一个 key 对应一个人。用户端
  # 若拿同一个 key 访问，所有人就都落在同一个 subject 下 —— 会话互相可见，因为
  # 在服务端看来他们本来就是同一个人。匿名身份解决的就是这件事：identity 由
  # 服务端在运行时签发（POST /api/v1/auth/anonymous），每个访客一个 anon:<uuid>，
  # 会话按它隔离。
  #
  # role 给 agent 是刻意的：匿名用户要能对话（/chat、/sessions 属 agent 组），
  # 但绝不该碰到 admin 的 dataset 组与 approver 的审批决策。
  #
  # SecretEnv 指向的密钥只从环境变量读。它一旦泄漏，任何人都能签出任意 subject
  # 的令牌 —— 会话隔离会整体失效，且没有任何症状。
  Anonymous:
    Enabled: true
    Role: "agent"
    SecretEnv: "EINO_ANONYMOUS_SECRET"
    # 令牌有效期。无状态令牌签出去收不回，有效期是唯一的兜底期限，上限一年。
    TTLHours: 720
    # 归属字符串的前缀，最终形如 anon:8f14e45f-...。别改：存量会话的归属
    # 就是靠它认出来的（日后接入账号登录，要按这个前缀把匿名历史迁到账号名下）。
    SubjectPrefix: "anon:"

  # 账号登录（管理后台建号 + 登录 + 首次强制改密）。
  #
  # ── 没有注册入口 ────────────────────────────────────────────────
  # 契约里**没有** POST /auth/register：账号只能由管理员通过 POST /api/v1/users
  # 创建（该组挂 RoleAdmin）。想让某人成为管理员只能改库
  # （UPDATE users SET role='admin'），因为建号接口刻意不接受 role 参数 ——
  # 见 internal/platform/auth/account.go 与 docs/known-gaps.md。
  #
  # ── 密钥 ────────────────────────────────────────────────────────
  # 与 anonymous 的密钥**应当**不同（建议 EINO_ACCOUNT_SECRET=$(openssl rand -hex 32)）。
  # 配成同一个值不会导致令牌串用（两者的令牌前缀是 user. / anon.，验签第一关就
  # 分开了），但会让「只轮换一半密钥」变成不可能的操作。这一点不做启动校验，
  # 免得本地图省事只配一个密钥时启动失败。
  Accounts:
    Enabled: true
    SecretEnv: "EINO_ACCOUNT_SECRET"
    # 令牌有效期。上限 30 天（config.maxAccountTTLHours），比匿名的上限紧得多：
    # 账号令牌泄漏的后果是「别人能以这个人的身份操作」，而它同样是无状态的
    # —— 改密码、停用账号都挡不住已签发的令牌，有效期是唯一兜底。
    TTLHours: 720
    # 管理员初始密码的 bcrypt 成本。0 表示用默认值（10），可配区间 10~16。
    # 每加 1 就把单次哈希耗时翻倍，而 /auth/login 没有限流，别配高。
    BcryptCost: 0

  UserSync:
    Enabled: false
Runtime:
  ReadTimeoutSeconds: 600
  WriteTimeoutSeconds: 120
  IdleTimeoutSeconds: 60
  MaxRequestBodyBytes: 5242880

Observability:
  LogLevel: "info"
  MetricsEnabled: true
  ServiceName: "eino-harness-server"
  Environment: "acceptance"
  OTLPEndpoint: "127.0.0.1:4317"
  OTLPInsecure: true
  TraceSampleRatio: 1.0
  LogFilePath: "logs/acceptance/server.json"
  LogMaxSizeMB: 100
  LogMaxBackups: 5
  LogMaxAgeDays: 14

Execution:
  Mode: "docker"
  DockerBinary: "docker"
  Image: "eino-harness-executor:0.1.0"
  User: "10001:10001"
  MemoryLimit: "512m"
  CPULimit: "1.0"
  PIDsLimit: 128
  TmpFSSize: "64m"
  AllowNetwork: false
  AllowLocalRunner: false

Knowledge:
  MaxDocumentBytes: 5242880
  # multipart 上传的请求总上限（含 multipart 边界与字段开销）。
  MaxUploadRequestBytes: 52428800
  # 单次最多接收的 file 字段数量；每个 file 仍受 MaxDocumentBytes 限制。
  MaxUploadFiles: 10
  DefaultTopK: 5
  MaxTopK: 200
  MaxQueryCharacters: 2000
  MaxResultBytes: 32768
  RecallGrouping:
    default: document
    product: document

Embedding:
  BaseURL: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  APIKeyEnv: "EINO_EMBEDDING_API_KEY"
  Model: "qwen3.7-text-embedding"
  Dimensions: 1024
  # 单次 embedding 请求最多带几段文本 —— 服务方的硬上限，不是调优项。
  # 超了会回 400「batch size is invalid, it should not be larger than 10」，
  # 而那一刻向量还没写、检索索引也还没写，整篇文档会什么都索引不上。
  # DashScope：text-embedding-v3/v4 上限 10，qwen3.7-text-embedding 上限 20。
  BatchSize: 10

Milvus:
  Address: "127.0.0.1:19530"
  Collection: "eino_acceptance_document_chunks_v1"
  MetricType: "COSINE"
  TopKCandidate: 30
  SearchTimeoutMS: 3000

# Optional ES: configure an isolated address and index in BOTH profiles.
ES:
  Address: []
  Index: "eino_acceptance_document_chunks_v1"
  Analyzer: "standard"
  Username: ""
  PasswordEnv: ""
  CaCertPath: ""
  BulkSize: 500
  MappingFile: "configs/es/chunk_mapping.yaml"

Maintenance:
  CleanupIntervalSeconds: 300
  ApprovalRetentionHours: 168
  CheckpointRetentionHours: 24
  TurnRetentionHours: 720
  CleanupBatchSize: 100

Retrieval:
  ExactWeight: 3.0
  KeywordWeight: 1.5
  VectorWeight: 1.0
  RRFSmoothing: 60
  ExactCandidateLimit: 200
  KeywordCandidateLimit: 300
  VectorCandidateLimit: 300
  EnableRerank: false
  MaxRerankCandidates: 20
  # Provider-neutral HTTP contract; enable only after endpoint/model are provisioned.
  RerankEndpoint: ""
  RerankAPIKeyEnv: "EINO_RERANK_API_KEY"
  RerankModel: ""
  RerankTimeoutMS: 2000

# Producer only: queue name "index" is part of the task contract.
Asynq:
  Enabled: true
  Redis:
    Addr: "127.0.0.1:6379"
    Username: ""
    PasswordEnv: ""
    DB: 15
  MaxRetries: 5
