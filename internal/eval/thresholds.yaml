# 检索召回的发布门禁。
#
# cmd/rag-test 跑完评测后逐项比对；任一项不达标就以非零退出码结束，
# 因此这份配置可以直接卡在 CI 或发布流水线里阻断质量回退。
#
# 调阈值的两条经验：
#   1. 先跑一轮看基线，再把门槛压在基线略下方。凭感觉写一个漂亮数字，
#      结果只能是长期红灯，红灯久了就没人看了。
#   2. minRecallAtK 与 minMRR 要一起看：Recall 高而 MRR 低说明"找到了但排得
#      很后"，检索能用但不好用，这类退化只看 Recall 发现不了。

# 通过率：失败用例占比超过 20% 就拦。失败 = 漏召 / 越权 / 结果条数不足。
minPassRate: 0.80

# Recall@K 宏平均（只统计有期望的用例）。
minRecallAtK: 0.70

# MRR：首个正确结果的名次倒数均值。0.6 大致对应"正确结果平均排在前两名"。
minMRR: 0.60

# ACL 泄漏：0 是唯一可接受的值。命中 forbidden 说明检索把不该给的文档给了，
# 这是安全事件而不是质量分项，不要为了"先放行"把它调高。
maxACLLeakCount: 0

# P95 延迟上限（毫秒）。评测是本机串行跑，这里卡的是数量级 ——
# 用来发现"某个通道退化成全表扫描"这类问题，不是性能基准。
maxP95LatencyMS: 5000
